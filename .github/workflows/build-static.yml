# Pages statiques automatiques (pré-rendu)
#
# hijama.site est une application monopage (SPA) : une seule page
# index.html, dont les « pages » sont des vues JavaScript derrière des
# URL propres (/ville/casablanca). Les pages statiques permettent à
# Google d'indexer chaque page sans exécuter de JavaScript.
#
# build-static.js génère une vraie page HTML par route (contenu complet
# + titre / méta / canonique dans le HTML brut) à partir des données
# Firestore en direct (aucun secret : API publique, clé déjà dans
# index.html). Les pages villes ne sont générées que pour les villes
# qui ont au moins un centre — quand un centre est approuvé dans une
# ville, sa page (centre + services + ville) est créée automatiquement
# au prochain passage.
#
# Ce workflow tourne tous les jours et peut être lancé à la main
# (onglet Actions → Build static pages → Run workflow). S'il produit
# des changements, il les committe et les pousse tout seul.
# La SEULE partie manuelle reste l'indexation : soumettre les
# nouvelles URL dans Google Search Console, de temps en temps.
name: Build static pages

on:
  schedule:
    - cron: "30 3 * * *" # tous les jours à 03:30 UTC (~04:30 au Maroc)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static pages
        run: node build-static.js
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Static build: regenerate pages + sitemap [skip ci]"
          git push
